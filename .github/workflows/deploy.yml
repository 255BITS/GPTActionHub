name: deploy
on:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: deploy-gptactionhub
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Patch hosted runner trust
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates openssl
          sudo update-ca-certificates
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' ca-certificates)" ge 20260816ubuntu0.24.04.1
      - name: Deploy to 255labs box
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          TASK_TMP="$(mktemp -d "${RUNNER_TEMP}/netcup-deploy.XXXXXX")"
          trap 'rm -rf "$TASK_TMP"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$TASK_TMP/key"
          printf '%s\n' '159.195.17.119 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcFN8/48EuW9f6MXgGx9a/syadihZ4XpY+EazT2KbQe' > "$TASK_TMP/known_hosts"
          ssh -i "$TASK_TMP/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$TASK_TMP/known_hosts" -o ConnectTimeout=15 root@159.195.17.119 gptactionhub
