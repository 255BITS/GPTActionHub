name: Security compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [portal, proxy, memory, persona, stability, zazzle, together]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Install the service graph and patched build tools
        run: |
          python -m pip install wheel==0.46.3 setuptools==84.2.1
          python -m pip install -r '${{ matrix.service }}/requirements.txt' pytest==9.0.3
          python -m pip check
      - name: Exercise real service routes offline
        env:
          SERVICE: ${{ matrix.service }}
        run: python -m pytest -q tests
